<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>用户端 - 阅读活动</title>
<style>
body{font-family:system-ui,"Microsoft YaHei";max-width:860px;margin:24px auto;padding:0 16px;color:#222}
h1{font-size:20px}h2{font-size:16px;margin-top:20px}
.card{border:1px solid #ddd;border-radius:8px;padding:14px;margin:10px 0}
input,select,button,textarea{padding:6px 10px;margin:4px 4px 4px 0;border:1px solid #ccc;border-radius:4px}
button{cursor:pointer;background:#0366d6;color:#fff;border:none}
button.gray{background:#666}
table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:6px;font-size:14px}
pre{background:#f6f8fa;padding:10px;border-radius:6px;font-size:13px;white-space:pre-wrap}
.ok{color:#1a7f37}.bad{color:#cf222e}
</style>
</head>
<body>
<h1><a href="/">←</a> 用户端</h1>

<div class="card">
身份：
<select id="acct"></select>
</div>

<div class="card"><h2>当前活动</h2><div id="activity">加载中…</div></div>

<div class="card"><h2>每日进度</h2>
日期 <input type="date" id="date"> <button onclick="loadProgress()">查询</button>
<div id="progress"></div>
</div>

<div class="card"><h2>积分与流水</h2><button onclick="loadPoints()">刷新</button>
<div id="points"></div></div>

<div class="card"><h2>提交申诉</h2>
业务日 <input type="date" id="adate">
<textarea id="content" rows="2" style="width:100%" placeholder="申诉描述（必填）"></textarea><br>
<button onclick="submitAppeal()">提交申诉</button>
<div id="appealResult"></div>
</div>

<script>
const accounts=[["user1","user-token-1"],["user2","user-token-2"],["user3","user-token-3"],["user4","user-token-4"],["user5","user-token-5"]];
const sel=document.getElementById("acct");
accounts.forEach(([n,t])=>{const o=document.createElement("option");o.value=t;o.textContent=n;sel.appendChild(o);});
sel.value=localStorage.getItem("tok")||"user-token-1";
sel.onchange=()=>{localStorage.setItem("tok",sel.value);loadAll();};
const today=new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Shanghai"});
document.getElementById("date").value=today;
document.getElementById("adate").value=today;
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{Authorization:"Bearer "+sel.value,...(opts.headers||{})}});return{status:r.status,body:await r.json()};}
async function loadActivity(){const{body}=await api("/api/v1/users/activity");const a=body.activity;
document.getElementById("activity").innerHTML=a?`<b>${a.name}</b> 门槛 ${a.daily_threshold} 篇/日，奖 ${a.reward_points} 分<br>${a.start_at} ~ ${a.end_at}`:"暂无已发布活动";}
async function loadProgress(){const d=document.getElementById("date").value||today;const{status,body}=await api("/api/v1/users/progress?date="+d);
document.getElementById("progress").innerHTML= status!=200?`<span class="bad">${body.error||""}</span>`:
`已计文章：<b>${(body.articles||[]).join(", ")||"无"}</b> ｜ 有效 ${body.distinct_count}/${body.threshold} ${body.reached?'<span class="ok">已达标</span>':""} ${body.rewarded?`<span class="ok">已发奖 ${body.reward_points} 分</span>`:""}`;}
async function loadPoints(){const{status,body}=await api("/api/v1/users/points");
let h= status!=200?`<span class="bad">${body.error||""}</span>`:`余额：<b>${body.balance}</b> 分<br><table><tr><th>流水ID</th><th>积分</th><th>类型</th><th>关联</th><th>时间</th></tr>`+
(body.txns||[]).map(t=>`<tr><td>${t.id}</td><td>${t.points}</td><td>${t.ref_type}</td><td>#${t.ref_id}</td><td>${t.created_at}</td></tr>`).join("")+"</table>";
if(!(body.txns||[]).length&&status==200)h+="<i>暂无流水</i>";document.getElementById("points").innerHTML=h;}
async function submitAppeal(){const d=document.getElementById("adate").value||today;const content=document.getElementById("content").value;
const{status,body}=await api("/api/v1/users/appeals",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+sel.value},body:JSON.stringify({date:d,content})});
document.getElementById("appealResult").innerHTML= status==200?`<span class="ok">提交成功：申诉 #${body.id}（${body.status}）</span>`:`<span class="bad">${status} ${body.error||""}</span>`;}
function loadAll(){loadActivity();loadProgress();loadPoints();}
loadAll();
</script>
</body>
</html>
