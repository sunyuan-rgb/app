<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>用户端 - 阅读活动</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--sub:#64748b;--line:#e2e8f0;--pri:#4f46e5;--pri-d:#4338ca;--green:#059669;--red:#dc2626;--amber:#d97706}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;min-height:100vh}
.topbar{background:linear-gradient(135deg,#1e1b4b,#3730a3);color:#fff;padding:18px 32px;display:flex;align-items:center;gap:14px}
.topbar h1{font-size:17px;font-weight:700}
.topbar .back{color:#c7d2fe;text-decoration:none;font-size:13px;border:1px solid rgba(199,210,254,.4);border-radius:8px;padding:4px 12px}
.topbar .back:hover{background:rgba(255,255,255,.08)}
.topbar .chip{margin-left:auto;font-size:12px;background:rgba(255,255,255,.12);border-radius:99px;padding:4px 14px;display:flex;align-items:center;gap:10px}
.topbar .chip button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;padding:2px 10px;font-size:11.5px;margin-left:0}
.topbar .chip button:hover{background:rgba(255,255,255,.25)}
.wrap{max-width:880px;margin:24px auto 60px;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.card h2{font-size:14.5px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:4px;height:16px;background:var(--pri);border-radius:2px}
input,select,button,textarea{padding:7px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;color:var(--ink);background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
button{cursor:pointer;background:var(--pri);color:#fff;border:none;font-weight:600;margin-left:6px}
button:hover{background:var(--pri-d)}
button.gray{background:#64748b}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;color:var(--sub);font-weight:600;font-size:12px;border-bottom:1.5px solid var(--line);padding:6px 8px}
td{border-bottom:1px solid var(--line);padding:7px 8px;font-family:Consolas,monospace;font-size:12.5px}
tr:hover td{background:#f8fafc}
.ok{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}
.kv{font-size:13.5px;color:var(--sub)}
.kv b{color:var(--ink);font-size:15px}
label{font-size:12.5px;color:var(--sub);margin-right:6px}
.auth{max-width:400px;margin:40px auto}
.auth .card{padding:26px 28px}
.auth input{width:100%;margin-bottom:12px;padding:9px 12px}
.auth button{width:100%;margin:6px 0 0;padding:10px}
.auth .hint{font-size:12px;color:var(--sub);margin-top:14px;line-height:1.7}
.tabs2{display:flex;gap:6px;margin-bottom:16px}
.tabs2 button{flex:1;background:#f1f5f9;color:var(--sub);margin:0;padding:9px}
.tabs2 button.on{background:var(--pri);color:#fff}
#authMsg{font-size:12.5px;margin-top:10px;min-height:18px}
</style>
</head>
<body>
<div class="topbar"><a class="back" href="/">← 返回</a><h1>用户端</h1>
<span class="chip"><span id="who-chip">未登录</span><button id="btn-logout" style="display:none" onclick="logout()">退出登录</button></span></div>
<main class="wrap">

<!-- 登录 / 注册（未登录时显示） -->
<div id="authCard" class="auth" style="display:none">
<div class="card">
<h2>账号登录</h2>
<div class="tabs2"><button id="tab-login" class="on" onclick="authTab('login')">登录</button><button id="tab-reg" onclick="authTab('register')">注册新账号</button></div>
<input id="auth-user" placeholder="账号名" autocomplete="username">
<input id="auth-pass" type="password" placeholder="密码" autocomplete="current-password">
<button onclick="authSubmit()">确定</button>
<div id="authMsg"></div>
<div class="hint">教学预置账号：<b>user1 ~ user5</b>，密码 <b>123456</b>；也可自行注册。会话令牌由服务端校验口令后下发，仅保存在本机浏览器。</div>
</div>
</div>

<!-- 登录后显示 -->
<div id="app" style="display:none">
<div class="card"><h2>当前活动</h2><div id="activity" class="kv">加载中…</div></div>

<div class="card"><h2>每日进度</h2>
<label>日期</label><input type="date" id="date"> <button onclick="loadProgress()">查询</button>
<div id="progress" class="kv" style="margin-top:10px"></div>
</div>

<div class="card"><h2>积分与流水</h2><button onclick="loadPoints()">刷新</button>
<div id="points" style="margin-top:10px"></div></div>

<div class="card"><h2>提交申诉</h2>
<label>业务日</label><input type="date" id="adate">
<textarea id="content" rows="2" style="width:100%;margin-top:10px" placeholder="申诉描述（必填，≤1024 字；同一业务日仅一条未结申诉）"></textarea><br>
<button onclick="submitAppeal()" style="margin-top:10px">提交申诉</button>
<div id="appealResult" style="margin-top:10px" class="kv"></div>
</div>
</div>

<script>
const today=new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Shanghai"});
document.getElementById("date").value=today;
document.getElementById("adate").value=today;

function getToken(){return localStorage.getItem("t10_token")||""}
function getUser(){return localStorage.getItem("t10_user")||""}

async function api(path,opts={}){
  const r=await fetch(path,{...opts,headers:{Authorization:"Bearer "+getToken(),...(opts.headers||{})}});
  return{status:r.status,body:await r.json()};
}

function authTab(t){
  document.getElementById("tab-login").classList.toggle("on",t==="login");
  document.getElementById("tab-reg").classList.toggle("on",t==="register");
}
function authMode(){return document.getElementById("tab-reg").classList.contains("on")?"register":"login"}

async function authSubmit(){
  const u=document.getElementById("auth-user").value.trim(),p=document.getElementById("auth-pass").value;
  const m=document.getElementById("authMsg");
  if(!u||!p){m.innerHTML='<span class="bad">请输入账号名和密码</span>';return}
  const mode=authMode();
  const r=await fetch("/api/v1/auth/"+mode,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})});
  const b=await r.json();
  if(r.status!==200&&r.status!==201){m.innerHTML=`<span class="bad">${b.error||r.status}</span>`;return}
  localStorage.setItem("t10_token",b.token);
  localStorage.setItem("t10_user",b.username);
  m.innerHTML=`<span class="ok">${mode==="register"?"注册成功":"登录成功"}：欢迎 ${b.username}</span>`;
  init();
}

function logout(){
  localStorage.removeItem("t10_token");localStorage.removeItem("t10_user");
  init();
}

function init(){
  const has=!!getToken();
  document.getElementById("authCard").style.display=has?"none":"";
  document.getElementById("app").style.display=has?"":"none";
  document.getElementById("btn-logout").style.display=has?"":"none";
  document.getElementById("who-chip").textContent=has?getUser():"未登录";
  if(has){loadActivity();loadProgress();loadPoints();}else{
    document.getElementById("auth-user").value="";document.getElementById("auth-pass").value="";
    document.getElementById("authMsg").innerHTML="";
  }
}

async function loadActivity(){const{body}=await api("/api/v1/users/activity");const a=body.activity;
document.getElementById("activity").innerHTML=a?`<b>${a.name}</b> 门槛 ${a.daily_threshold} 篇/日，奖 ${a.reward_points} 分<br>${a.start_at} ~ ${a.end_at}`:"暂无已发布活动";}
async function loadProgress(){const d=document.getElementById("date").value||today;const{status,body}=await api("/api/v1/users/progress?date="+d);
if(status===401||status===403){logout();return}
document.getElementById("progress").innerHTML= status!=200?`<span class="bad">${body.error||""}</span>`:
`已计文章：<b>${(body.articles||[]).join(", ")||"无"}</b> ｜ 有效 ${body.distinct_count}/${body.threshold} ${body.reached?'<span class="ok">已达标</span>':""} ${body.rewarded?`<span class="ok">已发奖 ${body.reward_points} 分</span>`:""}`;}
async function loadPoints(){const{status,body}=await api("/api/v1/users/points");
if(status===401||status===403){logout();return}
let h= status!=200?`<span class="bad">${body.error||""}</span>`:`余额：<b>${body.balance}</b> 分<br><table><tr><th>流水ID</th><th>积分</th><th>类型</th><th>关联</th><th>时间</th></tr>`+
(body.txns||[]).map(t=>`<tr><td>${t.id}</td><td>${t.points}</td><td>${t.ref_type}</td><td>#${t.ref_id}</td><td>${t.created_at}</td></tr>`).join("")+"</table>";
if(!(body.txns||[]).length&&status==200)h+="<i>暂无流水</i>";document.getElementById("points").innerHTML=h;}
async function submitAppeal(){const d=document.getElementById("adate").value||today;const content=document.getElementById("content").value;
const{status,body}=await api("/api/v1/users/appeals",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({date:d,content})});
if(status===401||status===403){logout();return}
document.getElementById("appealResult").innerHTML= status==200?`<span class="ok">提交成功：申诉 #${body.id}（${body.status}）</span>`:`<span class="bad">${status} ${body.error||""}</span>`;}

init();
</script>
</main>
</body>
</html>
