<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>资讯 App 阅读活动系统</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--sub:#64748b;--line:#e2e8f0;--pri:#4f46e5}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;min-height:100vh}
.topbar{background:linear-gradient(135deg,#1e1b4b,#3730a3);color:#fff;padding:34px 40px 30px}
.topbar h1{font-size:22px;font-weight:700;letter-spacing:1px}
.topbar p{font-size:13px;color:#c7d2fe;margin-top:8px;letter-spacing:2px}
.wrap{max-width:960px;margin:30px auto 60px;padding:0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
a.portal{display:flex;flex-direction:column;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 26px;text-decoration:none;color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.06);transition:.15s}
a.portal:hover{border-color:var(--pri);transform:translateY(-2px);box-shadow:0 8px 20px rgba(79,70,229,.12)}
a.portal b{font-size:16px}
a.portal span{font-size:13px;color:var(--sub);line-height:1.7}
.foot{margin-top:26px;text-align:center;font-size:12px;color:var(--sub)}
</style>
</head>
<body>
<div class="topbar"><h1>资讯 App 阅读活动系统</h1><p>每日阅读 · 公平奖励 · 透明结算</p></div>
<div class="wrap">
<div class="grid">
<a class="portal" href="/user"><b>用户中心</b><span>参与阅读活动，查看每日进度与积分明细，发起申诉</span></a>
<a class="portal" href="/agent"><b>客服工作台</b><span>申诉核查与处理，核对证据记录，执行补发或驳回</span></a>
<a class="portal" href="/ops"><b>运营管理台</b><span>发布与结束后核查活动，监督奖励发放与申诉处理</span></a>
<a class="portal" href="http://localhost:8081/"><b>阅读服务控制台</b><span>阅读行为记录与查询，为奖励结算提供可信依据</span></a>
</div>
<div class="foot">各工作台独立鉴权，请使用对应角色账号登录</div>
</div>
</body>
</html>
