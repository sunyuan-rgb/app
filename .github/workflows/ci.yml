name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  # CI 专用临时口令（仅本工作流生命周期内有效，非仓库密钥）
  CI_MYSQL_ROOT_PASSWORD: ci-root-pass

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-pass
          MYSQL_DATABASE: reading_activity
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -pci-root-pass --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      TEST_DSN: "root:ci-root-pass@tcp(127.0.0.1:3306)/"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Format check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Unit + concurrency tests with race detector (parallel packages)
        run: go test -race -count=1 -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage gate (total >=85%, each core package >=85%)
        run: go run ./scripts/covergate coverage.out

      - name: Build
        run: go build ./...

      - name: Upload coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Compose deploy (mysql + server + readingsvc)
        run: |
          cp .env.example .env
          sed -i "s/^MYSQL_ROOT_PASSWORD=.*/MYSQL_ROOT_PASSWORD=${CI_MYSQL_ROOT_PASSWORD}/" .env
          docker compose up -d --build

      - name: Health check
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/healthz >/dev/null; then
              echo "server healthy"; break
            fi
            sleep 3
          done
          curl -fsS http://localhost:8080/healthz

      - name: Smoke (event -> reward -> ops summary)
        run: |
          TOKEN=teach-events-token
          curl -fsS -X POST http://localhost:8080/api/v1/events \
            -H "X-Source-Token: $TOKEN" -H "Content-Type: application/json" \
            -d '{"event_id":"ci-1","user_id":1,"article_id":11,"occur_at":"'"$(date -d '+8 hour' +%Y-%m-%dT%H:%M:%S)+08:00"'"}'
          curl -fsS -H "Authorization: Bearer user-token-1" http://localhost:8080/api/v1/users/progress
          curl -fsS -H "Authorization: Bearer ops-token-1" http://localhost:8080/api/v1/ops/summary

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Teardown
        if: always()
        run: docker compose down -v
